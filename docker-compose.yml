# Infrastructure only:        docker compose up -d
# Infrastructure + services:  docker compose --profile apps up -d --build
#
# Run the services from your IDE against the infrastructure (default Spring config points to localhost):
#   Kafka localhost:29092, Postgres localhost:15432, Redis localhost:16379, OTLP localhost:4318

x-service-env: &service-env
  DB_USER: platform
  DB_PASSWORD: platform
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
  JWT_SECRET: ${JWT_SECRET:-local-dev-secret-key-at-least-32-bytes-long!}

x-service-deps: &service-deps
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy

services:
  # ---------------------------------------------------------------- infrastructure
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  jaeger:
    image: jaegertracing/all-in-one:1.64.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI
      - "4318:4318"     # OTLP/HTTP

  prometheus:
    image: prom/prometheus:v3.2.1
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "13000:3000"
    depends_on:
      - prometheus

  # ---------------------------------------------------------------- services (profile "apps")
  api-gateway:
    profiles: ["apps"]
    build:
      context: .
      args:
        MODULE: api-gateway
    environment:
      OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-key-at-least-32-bytes-long!}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AUTH_SERVICE_URL: http://auth-service:8081
      ORDER_SERVICE_URL: http://order-service:8082
      INVENTORY_SERVICE_URL: http://inventory-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
    ports:
      - "18080:8080"
    depends_on:
      redis:
        condition: service_healthy

  auth-service:
    profiles: ["apps"]
    build:
      context: .
      args:
        MODULE: auth-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/authdb
    ports:
      - "18081:8081"
    <<: *service-deps

  order-service:
    profiles: ["apps"]
    build:
      context: .
      args:
        MODULE: order-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/orderdb
    ports:
      - "18082:8082"
    <<: *service-deps

  inventory-service:
    profiles: ["apps"]
    build:
      context: .
      args:
        MODULE: inventory-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/inventorydb
    ports:
      - "18083:8083"
    <<: *service-deps

  payment-service:
    profiles: ["apps"]
    build:
      context: .
      args:
        MODULE: payment-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/paymentdb
      PAYMENT_DECLINE_ABOVE: "10000"
      PAYMENT_FAILURE_RATE: "0.0"
    ports:
      - "18084:8084"
    <<: *service-deps

  notification-service:
    profiles: ["apps"]
    build:
      context: .
      args:
        MODULE: notification-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/notificationdb
    ports:
      - "18085:8085"
    <<: *service-deps

volumes:
  postgres-data:
